name: Demo na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Strona stoi w podkatalogu /recall-lab/, wiec base-href musi to uwzgledniac.
      - run: npx ng build --base-href /recall-lab/

      # Pages nie zna tras Angulara — bez tego wejscie wprost na /talia/... daje 404.
      - run: cp dist/recall-lab/browser/index.html dist/recall-lab/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/recall-lab/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
